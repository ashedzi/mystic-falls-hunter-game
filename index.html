<!DOCTYPE html>
<html dir="ltr" lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Ashedzi Solomon">
        <meta name="description" content="TVD memory game">
        <meta name="keywords" content="web development, html, css, javascript, winnipeg, canada, tvd">
        <title>TVD Memory game</title>
        <link rel="icon" href="" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mrspecht/cdn/reset.css">
        <script src="./assets/js/app.js" defer></script>
        <link rel="stylesheet" href="./assets/css/main.css" media="all" >
    </head>
    <body>
        <main>
            <div class="container">
                <section>
                    <div class="flex header space-between">
                        <div class="flex align-center gap-10">
                            <i class="fa-solid fa-clock"></i>
                            <p>00</p>
                        </div>
                        <h2>The Mystic Falls hunter</h2>
                        <div>
                            <p>Moves:<span> 0</span></p>
                        </div>
                    </div>
                    <div class="flex column gap-4">
                        <div class="row-1 flex gap-4">
                            <div class="card card-1">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-2">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-3">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-4">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                        </div>
                        <div class="row-2 flex gap-4">
                            <div class="card card-1">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-2">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-3">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-4">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                        </div>
                        <div class="row-3 flex gap-4">
                            <div class="card card-1">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-2">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-3">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-4">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                        </div>
                        <div class="row-4 flex gap-4">
                            <div class="card card-1">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-2">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-3">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                            <div class="card card-4">
                                <div class="front grid"></div>
                                <div class="back grid"></div>
                            </div>
                        </div>
                        <button class="restart-game">Restart</button>
                    </div>
                </section>
            </div>
            <dialog class="flex column center gap-20">
                <h3>Welcome, Mystic Falls Hunter!</h3>
                <p>
                    Dark forces are stirring... and it's up to you to uncover the matching pairs of your favorite characters before time runs out.
                    Flip the cards, find the matches, and stay sharp as every move counts. 
                </p>
                <p>Ready to begin the hunt?</p>
                <button class="start-game">Start</button>
            </dialog>
        </main>
    </body>
</html>
